# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Avoid locale/encoding issues on some hosts
systemProp.user.language=en
systemProp.user.country=US
systemProp.file.encoding=UTF-8

# 项目路径含非 ASCII 字符（智谱），需要放开 AGP 的路径检查
android.overridePathCheck=true
# backdrop（液态玻璃）AAR 要求 compileSdk 37（AGP 9.1 已支持，此处抑制旧式兼容告警）
android.suppressUnsupportedCompileSdk=37
